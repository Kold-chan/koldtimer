<script>
const $=s=>document.querySelector(s);
const fmt=ms=>{if(ms==null)return"-";if(ms===Infinity)return"DNF";const s=ms/1000;return s>=60?Math.floor(s/60)+":"+(s%60).toFixed(2).padStart(5,"0"):s.toFixed(2)};
// ---------- Scramble ----------
function scramble(){const F=["R","L","U","D","F","B"],ax=f=>"RL".includes(f)?0:"UD".includes(f)?1:2;let r=[],l=-1,l2=-1;
while(r.length<20){const i=Math.random()*6|0,a=ax(F[i]);if(a===l||(a===l2&&l!==-1&&ax(F[l])!==a&&false))continue;if(a===l)continue;
if(r.length>1&&ax(r[r.length-2][0])===a&&ax(r[r.length-1][0])===a)continue;r.push(F[i]+["","'","2"][Math.random()*3|0]);l=a}
return r.join(" ")}
let sc="";const newSc=()=>{sc=scramble();$("#scr").textContent=sc;$("#pv").innerHTML=net(apply(solved(),sc))};
// ---------- Solves ----------
let solves=[];try{solves=JSON.parse(localStorage.getItem("cubo_solves")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("cubo_solves",JSON.stringify(solves))}catch(e){}};
const val=s=>s.dnf?Infinity:s.t+(s.p2?2000:0);
function avg(n,end){if(end<n)return null;const a=solves.slice(end-n,end).map(val).sort((x,y)=>x-y);
const m=a.slice(1,-1);if(m.includes(Infinity))return Infinity;return m.reduce((x,y)=>x+y,0)/m.length}
function render(){graph();const v=solves.map(val),ok=v.filter(x=>x!==Infinity);
const best=ok.length?Math.min(...ok):null,mean=ok.length?ok.reduce((a,b)=>a+b,0)/ok.length:null;
let b5=null,b12=null;for(let i=5;i<=solves.length;i++){const x=avg(5,i);if(x!=null&&(b5==null||x<b5))b5=x}
for(let i=12;i<=solves.length;i++){const x=avg(12,i);if(x!=null&&(b12==null||x<b12))b12=x}
const n=solves.length;
$("#st").innerHTML=[["Mejor",best],["Media",mean],["Ao5",avg(5,n)],["Mejor Ao5",b5],["Ao12",avg(12,n)],["Mejor Ao12",b12]].map(([k,x])=>`<div><span>${k}</span><b>${fmt(x)}</b></div>`).join("")+`<div><span>Solves</span><b>${n}</b></div>`;
$("#tb").innerHTML="<tr><th>#</th><th>Tiempo</th><th>Ao5</th><th>Ao12</th><th></th></tr>"+solves.map((s,i)=>i).reverse().map(i=>{const s=solves[i];
return`<tr><td>${i+1}</td><td>${s.dnf?"DNF":fmt(s.t+(s.p2?2000:0))+(s.p2?"+":"")}</td><td>${fmt(avg(5,i+1))}</td><td>${fmt(avg(12,i+1))}</td><td><button data-a="p" data-i="${i}">+2</button><button data-a="d" data-i="${i}">DNF</button><button data-a="x" data-i="${i}">✕</button></td></tr>`}).join("")}
$("#tb").onclick=e=>{const b=e.target.closest("button");if(!b)return;const s=solves[+b.dataset.i];
if(b.dataset.a==="p"){s.p2=!s.p2;s.dnf=false}else if(b.dataset.a==="d"){s.dnf=!s.dnf}else solves.splice(+b.dataset.i,1);save();render()};
$("#rs").onclick=()=>{if(confirm("¿Borrar todos los tiempos?")){solves=[];save();render()}};
$("#nx").onclick=newSc;
// ---------- Timer ----------
let st="idle",t0=0,raf,hold,insT,insEnd=0;const T=$("#time");
function tick(){T.textContent=fmt(performance.now()-t0);raf=requestAnimationFrame(tick)}
function press(){if(st==="run"){stop();return}if(st==="idle"||st==="insp"){T.className="red";hold=performance.now();st=st==="insp"?"inspHold":"hold";
setTimeout(()=>{if(st==="hold"||st==="inspHold")T.className="green"},300)}}
function release(){if(st==="hold"||st==="inspHold"){const ready=performance.now()-hold>=300;
if(ready){clearInterval(insT);T.className="";start()}else{T.className="";st=st==="inspHold"?"insp":"idle";return}}
else if(st==="idle"&&$("#ins").checked&&false){}}
function start(){st="run";t0=performance.now();raf=requestAnimationFrame(tick)}
function stop(){cancelAnimationFrame(raf);const t=performance.now()-t0;st="done";T.textContent=fmt(t);
solves.push({t:Math.round(t/10)*10,p2:false,dnf:false,sc});save();render();newSc();setTimeout(()=>st="idle",300)}
function beginInsp(){st="insp";insEnd=performance.now()+15000;insT=setInterval(()=>{const r=Math.ceil((insEnd-performance.now())/1000);T.textContent=r>0?r:(r>-2?"+2":"DNF")},100);T.textContent=15}
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.code==="Space"){e.preventDefault();if(e.repeat)return;
if(st==="idle"&&$("#ins").checked){beginInsp();return}press()}else if(st==="run")stop()});
addEventListener("keyup",e=>{if(e.code==="Space")release()});
T.addEventListener("touchstart",e=>{e.preventDefault();if(st==="idle"&&$("#ins").checked){beginInsp();return}press()},{passive:false});
T.addEventListener("touchend",e=>{e.preventDefault();release()},{passive:false});
// ---------- Algoritmos ----------
const D={

"25|R' F' R U R U' R' F","26|R U' R' U R U2 R' U R U' R'","27|R U R' U' R U R' U' R U R'","28|R U' R' U R U2 R' U R U' R'",

const grp=Object.keys(D);let cur=grp[0];
function drawSub(){$("#sub").innerHTML=grp.map(g=>`<button class="${g===cur?"on":""}" data-g="${g}">${g}</button>`).join("")}
function drawAlg(){const q=$("#q").value.toLowerCase();let h="";
for(const [sec,list] of Object.entries(D[cur])){const it=list.map(x=>x.split("|")).filter(([n,a])=>!q||(n+" "+a+" "+sec).toLowerCase().includes(q));
if(!it.length)continue;h+=`<h3>${sec}</h3><div class="grid">`+it.map(([n,a])=>`<div class="alg" data-a="${a}">${dia(a,sec)}<div class="in"><h4>${sec.includes("F2L")?"F2L ":sec.includes("OLL")&&!sec.includes("2-Look")?"OLL ":sec.includes("PLL")&&!sec.includes("2-Look")?"PLL ":""}${n}</h4><code>${a}</code><small>${len(a)} movimientos</small></div></div>`).join("")+"</div>"}
$("#al").innerHTML=h||"<p>Sin resultados.</p>"}
$("#sub").onclick=e=>{const b=e.target.closest("button");if(b){cur=b.dataset.g;drawSub();drawAlg()}};
$("#q").oninput=drawAlg;
$("#al").onclick=e=>{const c=e.target.closest(".alg");if(!c)return;try{navigator.clipboard.writeText(c.dataset.a);const s=document.createElement("small");s.textContent="Copiado ✓";c.appendChild(s);setTimeout(()=>s.remove(),1200)}catch(_){}};
// ---------- Tabs / tema ----------
function tab(n){$("#p1").classList.toggle("hide",n!==1);$("#p2").classList.toggle("hide",n!==2);$("#t1").classList.toggle("on",n===1);$("#t2").classList.toggle("on",n===2)}
$("#t1").onclick=()=>tab(1);$("#t2").onclick=()=>tab(2);
$("#th").onclick=()=>{const r=document.documentElement,d=matchMedia("(prefers-color-scheme: dark)").matches,c=r.dataset.theme||(d?"dark":"light");r.dataset.theme=c==="dark"?"light":"dark"};
const C={U:"#facc15",D:"#f8fafc",F:"#22c55e",B:"#3b82f6",R:"#ef4444",L:"#f97316"};
const MV={R:[0,-1,p=>p[0]==1],L:[0,1,p=>p[0]==-1],U:[1,-1,p=>p[1]==1],D:[1,1,p=>p[1]==-1],F:[2,-1,p=>p[2]==1],B:[2,1,p=>p[2]==-1],M:[0,1,p=>p[0]==0],E:[1,1,p=>p[1]==0],S:[2,-1,p=>p[2]==0],r:[0,-1,p=>p[0]>=0],l:[0,1,p=>p[0]<=0],u:[1,-1,p=>p[1]>=0],d:[1,1,p=>p[1]<=0],f:[2,-1,p=>p[2]>=0],b:[2,1,p=>p[2]<=0],x:[0,-1,()=>1],y:[1,-1,()=>1],z:[2,-1,()=>1]};
const rot=(v,a,s)=>a==0?[v[0],-v[2]*s,v[1]*s]:a==1?[v[2]*s,v[1],-v[0]*s]:[-v[1]*s,v[0]*s,v[2]];
function solved(){const o=[];for(let x=-1;x<2;x++)for(let y=-1;y<2;y++)for(let z=-1;z<2;z++)[[x==1,[1,0,0],"R"],[x==-1,[-1,0,0],"L"],[y==1,[0,1,0],"U"],[y==-1,[0,-1,0],"D"],[z==1,[0,0,1],"F"],[z==-1,[0,0,-1],"B"]].forEach(([k,n,c])=>k&&o.push({p:[x,y,z],n,c}));return o}
function apply(cube,alg){alg.trim().split(/\s+/).forEach(t=>{const m=MV[t[0]];if(!m)return;const k=t[1]=="2"?2:1,s=t[1]=="'"?-m[1]:m[1];for(let i=0;i<k;i++)cube.forEach(q=>{if(m[2](q.p)){q.p=rot(q.p,m[0],s);q.n=rot(q.n,m[0],s)}})});return cube}
const inv=a=>a.trim().split(/\s+/).reverse().map(t=>t.endsWith("'")?t[0]:t.endsWith("2")?t:t+"'").join(" ");
const len=a=>a.trim().split(/\s+/).filter(t=>!/^[xyz]/.test(t)).length;
function orient(q){for(const a of ["","x","x2","x'","z","z'"])for(const b of ["","y","y2","y'"]){const c=apply(q.map(t=>({...t})),a+" "+b);const ce=t=>t.p.filter(v=>!v).length==2,u=c.find(t=>t.c=="U"&&ce(t)),f=c.find(t=>t.c=="F"&&ce(t));if(u&&f&&u.n[1]==1&&f.n[2]==1)return c}return q}
const NF={"0,1,0":[3,0,t=>[t.p[0]+1,t.p[2]+1]],"0,0,1":[3,3,t=>[t.p[0]+1,1-t.p[1]]],"1,0,0":[6,3,t=>[1-t.p[2],1-t.p[1]]],"0,0,-1":[9,3,t=>[1-t.p[0],1-t.p[1]]],"-1,0,0":[0,3,t=>[t.p[2]+1,1-t.p[1]]],"0,-1,0":[3,6,t=>[t.p[0]+1,1-t.p[2]]]};
function net(q){let h='<svg viewBox="0 0 84 63">';q.forEach(t=>{const [ox,oy,f]=NF[t.n.join(",")],[c,r]=f(t);h+=`<rect x="${(ox+c)*7+.4}" y="${(oy+r)*7+.4}" width="6.2" height="6.2" rx="1" fill="${C[t.c]}" stroke="#0006" stroke-width=".4"/>`});return h+"</svg>"}
function dia(a,sec){let q=apply(solved(),inv(a)),h="";const st='stroke="#111" stroke-width=".8"';
if(sec.includes("F2L")){h='<svg viewBox="0 0 100 112">';q.forEach(t=>{const n=t.n;if(n[0]+n[1]+n[2]<1)return;const ax=[0,1,2].filter(k=>!n[k]),pts=[[1,1],[1,-1],[-1,-1],[-1,1]].map(([i,j])=>{const v=t.p.map((c,k)=>c+.5*n[k]+.45*(k==ax[0]?i:0)+.45*(k==ax[1]?j:0));return((v[0]-v[2])*.866*18+50).toFixed(1)+","+((-v[1]+(v[0]+v[2])*.5)*18+56).toFixed(1)}).join(" ");h+=`<polygon points="${pts}" fill="${C[t.c]}" ${st}/>`});return h+"</svg>"}
q=orient(q);const S=16,ol=sec.includes("OLL");h='<svg viewBox="0 0 74 74">';
q.forEach(t=>{const [x,y,z]=t.p,[nx,ny,nz]=t.n,fill=ol?(t.c=="U"?C.U:"#6b7280"):C[t.c];let R=null;
if(ny==1)R=[(x+1)*S+10,(z+1)*S+10,S-2,S-2];else if(y==1){if(nz==1)R=[(x+1)*S+10,3*S+12,S-2,5];else if(nz==-1)R=[(x+1)*S+10,3,S-2,5];else if(nx==1)R=[3*S+12,(z+1)*S+10,5,S-2];else if(nx==-1)R=[3,(z+1)*S+10,5,S-2]}
if(R)h+=`<rect x="${R[0]}" y="${R[1]}" width="${R[2]}" height="${R[3]}" rx="2" fill="${fill}" ${st}/>`});return h+"</svg>"}
function graph(){const v=solves.slice(-40).map(val).filter(x=>x!==Infinity);if(v.length<2){$("#gr").innerHTML="<small style='color:var(--mu)'>Gráfica de progreso: resuelve al menos 2 veces</small>";return}
const mn=Math.min(...v),mx=Math.max(...v),pts=v.map((x,i)=>(i/(v.length-1)*300).toFixed(1)+","+(55-(x-mn)/(mx-mn||1)*50).toFixed(1)).join(" ");
$("#gr").innerHTML=`<svg viewBox="0 0 300 60" preserveAspectRatio="none" style="width:100%;height:80px"><polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
$("#rnd").onclick=()=>{const all=Object.entries(D[cur]).flatMap(([s,l])=>l.map(x=>[s,...x.split("|")]));const [s,n,a]=all[Math.random()*all.length|0];
$("#tr").innerHTML=`<div class="box tr">${dia(a,s)}<div><b>Entrenamiento: ${s} ${n}</b><br><small>Aplica este setup a un cubo resuelto:</small><br><code>${inv(a)}</code><br><br><button onclick="this.nextElementSibling.hidden=false;this.hidden=true">Ver solución</button><code hidden>${a}</code></div></div>`};
newSc();render();drawSub();drawAlg();
